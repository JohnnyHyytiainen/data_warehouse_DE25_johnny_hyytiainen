# Projektets namn - Används igen som första nivå under models
name: 'dbt_code'
version: '1.0.0'

# Vilket block i ~/.dbt/profiles.yml som ger anslutningen till Snowflake
profile: 'class_dbt_code'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
macro-paths: ["macros"]

# Mappar som dbt clean tar bort.
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Inställningar för modellerna. Trädet ska spegla mapparna under models/
models:
  dbt_code:                   # det här projektets modeller
    +materialized: table      # standard för alla mappar som inte säger annat
    # --- föreläsning 09 ---
    staging:                  # allt i models/staging/
      +schema: staging
    refined:                  # allt i models/refined/
      +schema: warehouse
    # --- föreläsning 10 ---
    src:                      # allt i models/src/ — byggs aldrig, blir CTE nedströms
      +materialized: ephemeral
    dim:                      # dimensionerna till warehouse
      +schema: warehouse
    fct:                      # faktatabellen till warehouse
      +schema: warehouse
    mart:                     # marterna till marts
      +schema: marts