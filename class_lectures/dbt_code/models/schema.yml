# tester
models:
    # Tester för unika värden och null checks
    - name: dim_employer        # Representerar vilken table
      description: "Information about employer such as name, workplace address, organisation number"
      columns:                  # Representerar vilken column
        - name: employer_id     # Vilken column ska testas
          description: "Primary key, a surrogate key thats generated based on columns: id, employer_id."
          data_tests:           # Vilka tester ska köras
            - unique            # unique values på i column
            - not_null          # inga null values i column
        - name: workplace_city  # Ny column
          data_tests:           # tester som ska köras
            - not_null          # Inga null values i column

    - name: dim_job_details
      description: "Information about the job ad"
      columns:
        - name: job_details_id
          description: "Primary key, a surrogate key thats generated based on columns, id job_details_id"
          data_tests: 
            - unique
            - not_null
        - name: job_ad_id
          data_tests:
            - unique
            - not_null
        - name: headline
          data_tests:
            - not_null

    - name: dim_occupation
      description: "Information about the occupation, occupation group and occupation field."
      columns:
        - name: occupation_id
          description: "Primary key, a surrogate key thats generated based on columns, id occupation_id"
          data_tests:
            - unique
            - not_null
        - name: occupation_field
          data_tests:
            - not_null
        - name: occupation
          data_tests:
            - not_null

    - name: dim_auxiliary_attributes
      description: "Information about the job description and what is needed such as experience, drivers license and access to car."
      columns:
        - name: auxiliary_attributes_id
          description: "Primary key, a surrogate key thats generated based on columns, id auxiliary_attributes_id"
          data_tests:
            - unique
            - not_null
        



    # Kontroll över PK-FK relationer mellan fact och dimension tables.
    - name: fct_job_ads
      description: "The facts are relevance and vacancies."
      columns:
        - name: occupation_id
          description: "Foreign key, a surrogate key generated for each unique occupation"
          data_tests:
            - relationships:
                to: ref('dim_occupation')
                field: occupation_id
        - name: job_details_id
          description: "Foreign key, a surrogate key generated for each unique job"
          data_tests:
            - relationships:
                to: ref('dim_job_details')
                field: job_details_id
        - name: employer_id
          data_tests:
            - relationships:
                to: ref('dim_employer')
                field: employer_id
        - name: auxiliary_attributes_id
          data_tests:
            - relationships:
                to: ref('dim_auxiliary_attributes')
                field: auxiliary_attributes_id
    # Koll av relevance columnen i fact table. Ska vara ett float value mellan 0-1
        - name: relevance
          data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0  
              max_value: 1 
          # Data type test
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: float
        # Antal 'vacancies' 99th percentilen (99% av tiden ska det vara mellan 1-20 vacancies)
        - name: vacancies
          data_tests: 
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              quantile: .99
              min_value: 1
              max_value: 20